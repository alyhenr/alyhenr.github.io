<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>alyhenr — page not found</title>

  <!--
    Paths here are root-absolute on purpose.

    GitHub Pages serves this page for a missing path at ANY depth (e.g.
    /plugins/nope/) while leaving that path in the URL bar, so relative
    paths ('css/…', '../css/…') would resolve against whatever folder the
    visitor mistyped. Root-absolute is the only form that works everywhere.

    This is a user page (repo: alyhenr.github.io), served at the domain
    root, so no path prefix is needed. A move to a project page would
    require prefixing every path below, plus CHROME_CONFIG.basePath.
  -->
  <link rel="stylesheet" href="/css/tokens.css" />
  <link rel="stylesheet" href="/css/components.css" />
</head>
<body>

  <main class="page">

    <section class="window">
      <div class="window__bar">
        <span class="window__title">error</span>
        <span class="window__controls" aria-hidden="true">
          <span class="window__control"></span>
          <span class="window__control"></span>
          <span class="window__control"></span>
        </span>
      </div>
      <div class="window__body">

        <p class="subtitle">Error 404</p>
        <h1 class="title">Page not found</h1>

        <p class="lede">
          The page you asked for doesn't exist — it may have moved, or the address may
          have a typo in it.
        </p>

        <p class="notice">
          Requested: <code id="not-found-path">—</code>
        </p>

        <div class="btn-row">
          <a class="btn btn--primary" href="/">Go to the homepage</a>
          <a class="btn" href="/plugins/index.html">Browser extensions</a>
          <a class="btn" href="/contact.html">Contact</a>
        </div>

      </div>
    </section>

  </main>

  <script>
    window.CHROME_CONFIG = { user: 'alyhenr', host: 'alyhenr.dev', activePage: '', basePath: '/' };

    // Show the attempted path, so a mistyped URL is obvious
    (function showPath() {
      const el = document.getElementById('not-found-path');
      if (el) el.textContent = window.location.pathname;
    })();
  </script>
  <script src="/js/chrome.js"></script>
  <script src="/js/filesystem.js"></script>
  <script src="/js/terminal.js"></script>
  <script>
    Terminal.init({ user: 'alyhenr', host: 'alyhenr.dev', cwd: '/', basePath: '/' });
  </script>

</body>
</html>
