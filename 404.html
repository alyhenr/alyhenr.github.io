<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>alyhenr ~ 404</title>

  <!--
    SITE ROOT — the only file that hardcodes it.

    GitHub Pages serves this page for a missing path at ANY depth (e.g.
    /personal-website/plugins/nope/) while leaving that path in the URL bar,
    so relative asset paths ('css/…', '../css/…') would resolve against the
    wrong directory and silently fail. Root-absolute paths that include the
    repo prefix are the only form that works at every depth.

    Moving to a custom domain (alyhenr.dev): change every
    /personal-website/ below — and CHROME_CONFIG.basePath at the bottom —
    to just /
  -->
  <link rel="stylesheet" href="/personal-website/css/tokens.css" />
  <link rel="stylesheet" href="/personal-website/css/terminal.css" />
  <link rel="stylesheet" href="/personal-website/css/effects.css" />
</head>
<body class="terminal-window">

  <div id="terminal-header"></div>

  <main class="terminal-content">
    <div class="cmd-block">
      <div class="prompt">
        <span class="prompt__user">alyhenr</span><span class="prompt__at">@</span><span
          class="prompt__host">alyhenr.dev</span><span class="prompt__sep">:</span><span
          class="prompt__path">~</span><span class="prompt__sigil">$</span>&nbsp;<span
          class="prompt__command" id="not-found-path"></span>
      </div>

      <p class="output output--error">bash: <span id="not-found-cmd"></span>: No such file or directory</p>
      <div class="output output--blank"></div>
      <p class="output output--dim">
        The path you requested does not exist.
        Try  <a href="/personal-website/">cd ~</a>  to go home.
      </p>
      <div class="output output--blank"></div>

      <pre class="ascii-art ascii-art--dim">
  _  _    ___  _  _
 | || |  / _ \| || |
 | || |_| | | | || |_
 |__   _| |_| |__   _|
    |_|  \___/   |_|
      </pre>

      <p class="output output--dim">→ <a href="/personal-website/">return home</a></p>
    </div>
  </main>

  <div id="terminal-nav"></div>

  <script>
    window.CHROME_CONFIG = { activePage: '', basePath: '/personal-website/' };

    // Show the attempted path in the error output
    const path = window.location.pathname;
    const cmdEl = document.getElementById('not-found-path');
    const errEl = document.getElementById('not-found-cmd');
    if (cmdEl) cmdEl.textContent = `cat ${path}`;
    if (errEl) errEl.textContent = path;
  </script>
  <script src="/personal-website/js/chrome.js"></script>
  <script src="/personal-website/js/filesystem.js"></script>

</body>
</html>
