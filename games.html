<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="alyhenr — games" />

  <title>alyhenr ~ games</title>

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/terminal.css" />
  <link rel="stylesheet" href="css/effects.css" />
</head>
<body class="terminal-window">

  <div id="terminal-header"></div>

  <main class="terminal-content" id="terminal-output-wrapper">
    <div id="terminal-output">

      <!-- ls -la /games/ -->
      <div class="cmd-block">
        <div class="prompt">
          <span class="prompt__user">alyhenr</span><span class="prompt__at">@</span><span
            class="prompt__host">alyhenr.dev</span><span class="prompt__sep">:</span><span
            class="prompt__path">/games</span><span class="prompt__sigil">$</span>&nbsp;<span
            class="prompt__command">ls -la</span>
        </div>

        <p class="output output--dim">Playable games — click or type  open &lt;name&gt;  to launch</p>
        <div class="output output--blank"></div>

        <div class="ls-table">

          <!--
            Template for adding new games:

            <div class="ls-entry ls-entry--clickable" role="link" tabindex="0"
                 onclick="location.href='games/yourname.html'"
                 onkeydown="if(event.key==='Enter')location.href='games/yourname.html'">
              <span class="ls-entry__perms">-rwxr-xr-x</span>
              <span class="ls-entry__size">??kb</span>
              <span class="ls-entry__date">YYYY-MM</span>
              <span class="ls-entry__name ls-entry__name--exec">yourname</span>
              <span class="ls-entry__desc">One-line description</span>
            </div>
          -->

          <div class="ls-entry ls-entry--clickable" role="link" tabindex="0"
               onclick="location.href='games/snake.html'"
               onkeydown="if(event.key==='Enter')location.href='games/snake.html'">
            <span class="ls-entry__perms">-rwxr-xr-x</span>
            <span class="ls-entry__size">8kb</span>
            <span class="ls-entry__date">2025-06</span>
            <span class="ls-entry__name ls-entry__name--exec">snake</span>
            <span class="ls-entry__desc">Classic snake — terminal edition</span>
          </div>

        </div><!-- /.ls-table -->

        <div class="output output--blank"></div>
        <p class="output output--dim">
          <span class="output--amber">TIP:</span>
          type  open snake  or  cd /games/snake  to launch a game
        </p>
        <div class="output output--blank"></div>
      </div>

    </div><!-- /#terminal-output -->

    <!-- Interactive input row -->
    <form id="terminal-form" class="terminal-input-row" autocomplete="off" spellcheck="false">
      <div class="terminal-input-row__prompt prompt" aria-hidden="true">
        <span class="prompt__user">alyhenr</span><span class="prompt__at">@</span><span
          class="prompt__host">alyhenr.dev</span><span class="prompt__sep">:</span><span
          class="prompt__path" id="input-cwd">/games</span><span class="prompt__sigil">$</span>&nbsp;
      </div>
      <label for="terminal-input" class="sr-only">Terminal input</label>
      <input id="terminal-input" class="terminal-input" type="text"
             placeholder="type a command…" aria-label="Terminal command input" />
    </form>

  </main>

  <div id="terminal-nav"></div>

  <script>
    window.CHROME_CONFIG = { user: 'alyhenr', host: 'alyhenr.dev', activePage: 'games' };
  </script>
  <script src="js/chrome.js"></script>
  <script src="js/filesystem.js"></script>
  <script src="js/terminal.js"></script>
  <script>
    Terminal.init({ user: 'alyhenr', host: 'alyhenr.dev', cwd: '/games' });

    // Override `open` / `go` on this page to handle game names too
    Terminal.register('open', {
      description: 'Launch a game by name.',
      usage: 'open <game>',
      run(args, term) {
        const target = args[1] ? args[1].toLowerCase() : null;
        if (!target) { term.error('open: missing game name'); return; }

        const gameMap = {
          snake: 'games/snake.html',
        };

        const href = gameMap[target];
        if (!href) {
          term.error(`open: unknown game '${target}'. Available: ${Object.keys(gameMap).join(', ')}`);
          return;
        }

        term.dim(`Launching ${target}...`);
        setTimeout(() => { window.location.href = href; }, 300);
      },
    });
  </script>

</body>
</html>
