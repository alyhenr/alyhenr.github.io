<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Writing and notes by Alysson Almeida — engineering, side projects, and what I learn along the way." />

  <title>alyhenr — writing</title>

  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>

  <main class="page">

    <section class="window">
      <div class="window__bar">
        <span class="window__title">writing</span>
        <span class="window__controls" aria-hidden="true">
          <span class="window__control"></span>
          <span class="window__control"></span>
          <span class="window__control"></span>
        </span>
      </div>
      <div class="window__body">
        <p class="subtitle">Notes &amp; posts</p>
        <h1 class="title">Writing</h1>
        <p class="lede">
          Occasional writing about engineering, the things I build, and what I learn
          doing it.
        </p>

        <!--
          Post index.
          To add a post:
            1. Create a new .html file in /blog/ (copy blog/first-post.html)
            2. Add a .card below
            3. Register it in js/filesystem.js so the terminal can find it
        -->
        <div class="card-grid">

          <a class="card" href="blog/first-post.html">
            <span class="card__eyebrow">2025-06</span>
            <span class="card__title">Your First Blog Post</span>
            <span class="card__desc">Your first blog post — add a short teaser here.</span>
          </a>

        </div>
      </div>
    </section>

  </main>

  <script>
    window.CHROME_CONFIG = { user: 'alyhenr', host: 'alyhenr.dev', activePage: 'blog' };
  </script>
  <script src="js/chrome.js"></script>
  <script src="js/filesystem.js"></script>
  <script src="js/terminal.js"></script>
  <script>
    Terminal.init({ user: 'alyhenr', host: 'alyhenr.dev', cwd: '/blog' });
  </script>

</body>
</html>
